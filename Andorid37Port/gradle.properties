#   extramirror.admobBannerId=ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ
#   extramirror.privacyPolicyUrl=https://example.com/extramirror/privacy
# ---------------------------------------------------------------------------
